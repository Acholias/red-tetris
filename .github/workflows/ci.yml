name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Define matrix to run the job 3 times with different project paths
    strategy:
      matrix:
        project: [shared, server, client]

    # Setup where steps will be executed dynamically
    defaults:
      run:
        working-directory: ./${{ matrix.project }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './${{ matrix.project }}/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests (${{ matrix.project }})
      run: npm run coverage
